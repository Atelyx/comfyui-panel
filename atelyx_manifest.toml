schema_version = "1.0.0"
id = "com.atelyx.comfyui-panel"
name = "ComfyUI"
tagline = "选工作流、调参、排队生成，结果存进当前仓库；托管启停与更新 ComfyUI"
version = "0.1.8"
type = "add-on"
maintainer = "Xuhang944 <352643547@qq.com>"
license = ["SPDX:MIT"]
copyright = ["2026 Xuhang944"]
platforms = ["windows-x64", "linux-x64"]
host_version_min = "0.6.6"
api_version = 1
singleton = true
keep_mounted_on_vault_switch = true

[permissions]
process = "启停 ComfyUI 进程、运行 git 更新与打开浏览器"
files = "读写插件私有副本与仓库文件"
clipboard = "读取粘贴的参考图、复制结果图"
dialog = "选择安装目录、参考图与另存位置"
notification = "进程失败与退出提醒"
ai = "把当前生成登记为 AI 工具"
state = "保存本插件的设置与生成历史"

[entry]
windows = "comfyui_panel.dll"
linux = "libcomfyui_panel.so"

[build]
paths = ["comfyui_panel.dll", "libcomfyui_panel.so"]
paths_exclude_pattern = ["target/", ".*"]
