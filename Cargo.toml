[package]
name = "comfyui-panel"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 的 ComfyUI 原生插件：直连本机 ComfyUI，挑工作流、调参、排队生成、看实时进度，并把结果存进当前仓库；托管启停 ComfyUI 进程"
license = "MIT"

[dependencies]
atelyx-plugin-sdk = { path = "../../Atelyx/atelyx-plugin-sdk" }
atelyx-plugin-protocol = { path = "../../Atelyx/atelyx-plugin-protocol" }
serde = { version = "1", features = ["derive"] }
# 工作流的节点顺序即提交顺序（提示词取首个、尺寸取值、节点分组都依赖它），必须保序
serde_json = { version = "1", features = ["preserve_order"] }
# 日志时间戳取本地时区时刻（std 只有 UTC）
chrono = "0.4"
# 连接泵与插件自身任务；net/io-util 供 WebSocket，sync/time 供轮询与状态订阅
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "net"] }
async-trait = "0.1"
# 与 ComfyUI 通信的唯一通道：REST 直连（提交、队列、历史、取图、上传、userdata）
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# 实时进度与执行状态只有 WebSocket 这条通道有
tokio-tungstenite = "0.24"
futures-util = "0.3"
# clientId / originId / 随机种子取系统熵源
getrandom = "0.2"
# 参考图粘贴：宿主 clipboard 面返回 PNG 的 base64，本进程只做解码
base64 = "0.22"

[profile.release]
strip = true
lto = true
